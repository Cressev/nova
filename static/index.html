<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nova</title>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="%2318212f"/><text x="32" y="41" font-size="30" font-family="Arial" font-weight="700" text-anchor="middle" fill="white">N</text></svg>' />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <!-- dsh 形态：单侧栏 + 对话主区；砍掉右栏 Inspector / 模式卡 / 技能卡 / 状态卡 / 状态线 -->
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <header class="sidebar-head">
          <div class="brand-mark" aria-label="Nova"><span class="brand-core">N</span></div>
          <div class="sidebar-title">
            <h1>Nova</h1>
          </div>
          <span class="version-badge" id="nova-version">nova</span>
          <button id="theme-toggle" class="icon-ghost theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">◐</button>
          <button id="sidebar-toggle" class="icon-ghost collapse-toggle" type="button" aria-label="收起侧栏">‹</button>
        </header>

        <button id="new-chat" class="new-session" type="button">
          <span class="new-session-icon">⊕</span>
          <span class="new-session-label">新会话</span>
        </button>

        <div class="sidebar-group">
          <div class="group-label">
            <span>工作区</span>
            <button id="workspace-open" class="icon-ghost" type="button" aria-label="切换工作区" title="切换工作区">⇄</button>
          </div>
          <button class="workspace-entry" type="button" data-workspace-open title="切换工作区">
            <span class="workspace-icon" aria-hidden="true">▭</span>
            <span id="project-name">读取中</span>
          </button>
        </div>

        <div class="sidebar-group sidebar-sessions">
          <div class="group-label"><span>会话</span></div>
          <nav id="session-list" class="session-list"></nav>
        </div>

        <footer class="sidebar-foot">
          <button id="settings-open" class="sidebar-foot-button" type="button">
            <span class="foot-icon" aria-hidden="true">⚙</span>
            <span class="foot-label">设置</span>
          </button>
        </footer>
      </aside>

      <main class="main">
        <div class="main-inner">
          <!-- 空状态 Hero：新会话时展示 -->
          <section id="empty-hero" class="empty-hero">
            <div class="hero-mark" aria-hidden="true"><span>N</span></div>
            <h2 class="hero-title">探索未至之境</h2>
            <p class="hero-sub">Nova 个人开发 Agent · 本地网关</p>
          </section>

          <section id="messages" class="messages"></section>

          <form id="chat-form" class="composer-card">
            <textarea
              id="message"
              name="message"
              rows="1"
              placeholder="给 Nova 发送消息，输入 / 查看指令"
            ></textarea>
            <div class="composer-toolbar">
              <div class="toolbar-left">
                <span id="stream-state" class="stream-state" aria-live="polite"></span>
              </div>
              <div class="toolbar-right">
                <label class="toolbar-select permission-select" title="权限模式">
                  <span class="select-icon" aria-hidden="true">◇</span>
                  <select id="permission-select">
                    <option value="read_only">只读</option>
                    <option value="ask">询问</option>
                    <option value="workspace_write" selected>工作区写入</option>
                    <option value="plan">计划</option>
                    <option value="bypass">跳过权限</option>
                  </select>
                </label>
                <label class="toolbar-select model-select" title="模型">
                  <span class="select-icon" aria-hidden="true">◈</span>
                  <select id="model-select">
                    <option value="glm-4.7" selected>glm-4.7</option>
                  </select>
                </label>
                <button id="stop-button" class="round-button stop" type="button" disabled aria-disabled="true" aria-label="停止">■</button>
                <button id="send-button" class="round-button send" type="submit" aria-label="发送">↑</button>
              </div>
            </div>
            <div id="command-palette" class="command-palette" hidden></div>
          </form>
        </div>
      </main>
    </div>

    <!-- 设置弹窗（保留：运行配置 + statusline 偏好） -->
    <dialog id="settings-dialog" class="modal">
      <form method="dialog" class="modal-card">
        <div class="dialog-title">
          <strong>设置</strong>
          <button id="settings-close" type="button" aria-label="关闭">×</button>
        </div>
        <div class="settings-section">
          <button class="settings-section-head" type="button" data-settings-section="runtime">
            <span>运行配置</span>
            <em>模型、上下文、权限</em>
          </button>
          <div id="settings-runtime" class="settings-list"></div>
        </div>
        <div class="settings-section">
          <button class="settings-section-head" type="button" data-settings-section="statusline">
            <span>Statusline</span>
            <em>会话状态显示项</em>
          </button>
          <div id="settings-statusline" class="statusline-options"></div>
        </div>
        <div class="settings-actions">
          <p id="settings-note">配置修改后需要重启 Nova 网关才会生效。</p>
          <button id="settings-save" type="button">保存配置</button>
          <button id="settings-restart" type="button">重启网关</button>
        </div>
      </form>
    </dialog>

    <!-- 工作区切换弹窗（保留：IDE 体感路径选择） -->
    <dialog id="workspace-dialog" class="modal">
      <form method="dialog" class="modal-card">
        <div class="dialog-title">
          <strong>切换项目目录</strong>
          <button id="workspace-dialog-close" type="button" aria-label="关闭">×</button>
        </div>
        <input id="workspace-dialog-input" class="workspace-dialog-input" placeholder="输入本地项目绝对路径" autocomplete="off" />
        <div id="workspace-dialog-state" class="workspace-dialog-state">请输入或选择项目目录</div>
        <div id="workspace-dialog-list" class="workspace-dialog-list"></div>
        <div class="workspace-dialog-actions">
          <button id="workspace-dialog-create" type="button">新建并切换</button>
          <button id="workspace-dialog-submit" type="button">切换到此目录</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>
